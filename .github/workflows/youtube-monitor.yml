name: YouTube Monitor

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check channels and summarize new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        run: python src/youtube_monitor/monitor.py
      - name: Commit generated digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/youtube_monitor/state.json
          if [ -d outputs/youtube/digests ]; then git add outputs/youtube/digests; fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: update YouTube digests"
          git push
